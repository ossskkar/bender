<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Bender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
  :root{--void:#05070a;--panel:#0f1a22;--eye:#d9f7ff;--antenna:#39f0e6;--ui:#6f8b90;
        --cyan:#45e5f7;--mag:#ff3d8a;--rage:#ff4d6b;--glow:.14;--glowc:57,240,230;}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;width:100%;overflow:hidden;background:var(--void)}
  body{font-family:"VT323","Courier New",monospace;color:var(--ui);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none;}
  #stage{position:fixed;inset:0;overflow:hidden;
    background:radial-gradient(120% 100% at 50% 40%,var(--panel),var(--void) 72%);}
  #stage::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 55%,transparent 55%,rgba(0,0,0,.55));mix-blend-mode:multiply}
  #scan{position:absolute;inset:0;pointer-events:none;opacity:.22;
    background:repeating-linear-gradient(0deg,rgba(57,240,230,.05) 0 2px,transparent 2px 4px)}
  #rage{position:absolute;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(120% 100% at 50% 55%,rgba(255,77,107,.0),rgba(255,77,107,.5));mix-blend-mode:screen}
  #hud{position:absolute;left:50%;transform:translateX(-50%);z-index:5;
    bottom:calc(env(safe-area-inset-bottom,0px) + 22px + max(12px,3vh) + 14px);
    color:var(--eye);font-size:2.1rem;letter-spacing:.28em;text-transform:uppercase;
    opacity:.9;text-shadow:0 0 12px rgba(57,240,230,.55);pointer-events:none;white-space:nowrap}

  /* The projector pool the hologram stands in — a hologram casts light, not a shadow. */
  #shadow{position:absolute;bottom:calc(10% - 10px);left:50%;width:180px;height:30px;
    transform:translateX(-50%);border-radius:50%;pointer-events:none;
    background:radial-gradient(closest-side,rgba(69,229,247,.45),rgba(69,229,247,.08) 60%,transparent);
    filter:blur(2px)}

  /* ---------- the projection ----------
     The dashboard's .a-face parts, in the same order and with the same
     animations: one PNG three times (a base and two colour-split ghosts),
     then the scanlines and the sweep over them. --gs scales the ghost
     separation so the engine can glitch him by widening the split. */
  #bender{position:absolute;bottom:10%;left:50%;width:240px;height:240px;
    will-change:transform,left,bottom;pointer-events:none;z-index:3;--gs:1}
  #bender .proj{position:absolute;inset:0;
    animation:fc-float 7s ease-in-out infinite, fc-flicker 5.5s steps(1) infinite;
    filter:drop-shadow(0 0 22px rgba(var(--glowc),calc(var(--glow) * 2.2)))}
  #bender .proj img{position:absolute;inset:0;width:100%;height:100%;
    object-fit:contain;object-position:50% 40%;
    -webkit-mask-image:linear-gradient(to bottom,#000 72%,rgba(0,0,0,.4) 90%,transparent 100%);
    mask-image:linear-gradient(to bottom,#000 72%,rgba(0,0,0,.4) 90%,transparent 100%)}
  #bender .base{opacity:.96}
  #bender .ghost{opacity:.34}
  #bender .cy{animation:fc-drift-a 4.3s ease-in-out infinite}
  #bender .mg{animation:fc-drift-b 5.1s ease-in-out infinite}
  #bender .scan{position:absolute;inset:0;pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(69,229,247,.055) 0 1px,transparent 1px 3px);
    -webkit-mask-image:linear-gradient(to bottom,#000 70%,transparent 100%);
    mask-image:linear-gradient(to bottom,#000 70%,transparent 100%)}
  #bender .sweep{position:absolute;left:0;right:0;height:26%;pointer-events:none;
    background:linear-gradient(to bottom,transparent,rgba(69,229,247,.13) 45%,rgba(255,61,138,.09) 62%,transparent);
    animation:fc-sweep 5.6s linear infinite}
  /* Angry: the split turns hot and the ghosts stop being subtle. */
  #bender.hot .ghost{opacity:.6}
  #bender.hot .sweep{animation-duration:1.4s}
  /* Down: the projection loses its lock and collapses toward the plate. */
  /* the float animation also drives transform, so the collapse has to replace
     it rather than sit under it */
  #bender.ko .proj{animation:fc-flicker .6s steps(1) infinite;
    opacity:.5;transform:scaleY(.42) translateY(58%)}
  #bender.ko .sweep{animation-duration:.7s}

  @keyframes fc-float   { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  @keyframes fc-flicker { 0%,96%{opacity:1} 96.5%{opacity:.72} 97%{opacity:1}
                          97.6%{opacity:.55} 98.2%{opacity:1} }
  @keyframes fc-drift-a { 0%,100%{transform:translate(calc(-2px * var(--gs)),calc(1px * var(--gs)))}
                          50%{transform:translate(calc(-5px * var(--gs)),calc(-1px * var(--gs)))} }
  @keyframes fc-drift-b { 0%,100%{transform:translate(calc(2px * var(--gs)),calc(-1px * var(--gs)))}
                          50%{transform:translate(calc(5px * var(--gs)),calc(2px * var(--gs)))} }
  @keyframes fc-sweep   { from{transform:translateY(-40%)} to{transform:translateY(320%)} }

  #meter{position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:6;
    display:flex;gap:4px;width:min(80vw,420px);height:max(12px,3vh);pointer-events:none}
  #meter i{flex:1;border-radius:3px;background:rgba(120,140,150,.14);transition:none}
  #meter i.on{background:rgba(57,240,230,.95);box-shadow:0 0 12px rgba(57,240,230,.9)}
  #meter i.hi{background:rgba(255,77,157,.95);box-shadow:0 0 12px rgba(255,77,157,.9)}
  #wake{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:1rem;background:radial-gradient(120% 120% at 50% 40%,#101a22,var(--void) 72%);
    text-align:center;padding:2rem;transition:opacity .5s}
  #wake.hidden{opacity:0;pointer-events:none}
  #wake .name{font-size:clamp(3rem,17vw,7rem);line-height:.9;color:var(--eye);letter-spacing:.12em;
    text-shadow:0 0 16px var(--antenna),0 0 40px rgba(57,240,230,.4)}
  #wake .p{font-size:clamp(1.1rem,5vw,1.5rem);letter-spacing:.26em;text-transform:uppercase}
  #wake .p::after{content:"_";animation:bl 1.1s steps(1) infinite}
  #wake .s{font-size:clamp(.85rem,3.6vw,1.05rem);opacity:.7;letter-spacing:.12em;max-width:26ch}
  @keyframes bl{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){
    #scan{display:none}#wake .p::after{animation:none}
    #bender .proj,#bender .ghost,#bender .sweep{animation:none}
  }
</style>
<div id="stage">
  <div id="scan"></div><div id="rage"></div>
  <div id="hud">bender</div>
  <div id="shadow"></div>
  <div id="bender">
    <div class="proj">
      <img class="base"     src="assets/lain-face.png"    alt="" aria-hidden="true">
      <img class="ghost cy" src="assets/lain-face-cy.png" alt="" aria-hidden="true">
      <img class="ghost mg" src="assets/lain-face-mg.png" alt="" aria-hidden="true">
      <div class="scan"></div>
      <div class="sweep"></div>
    </div>
  </div>
  <div id="meter"></div>
</div>
<div id="wake">
  <div class="name">bender</div>
  <div class="p">tap to wake</div>
  <div class="s">he hears you, and reacts to taps, drags and shakes. nothing is recorded or sent.</div>
</div>
<script>
const R=document.documentElement, stage=document.getElementById('stage'),
      el=document.getElementById('bender'),
      shadow=document.getElementById('shadow'), rageEl=document.getElementById('rage'),
      wake=document.getElementById('wake');
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

let W=innerWidth||360,Hh=innerHeight||640;
function floorPx(){return Hh*0.155;}            // #bender bottom baseline
function margin(){return Math.max(70,W*0.16);}
// size the projection in plain px (no calc/var/min chains — those can collapse
// to 0 on iOS Safari), and keep him on-screen if the viewport was 0 at parse time
let BOX=240;
function layout(){
  W=innerWidth||W||360; Hh=innerHeight||Hh||640;
  BOX=Math.min(Hh*0.62,W*1.25,560);
  el.style.width=BOX+'px'; el.style.height=BOX+'px';
  shadow.style.width=(BOX*0.62)+'px';
  if(!(B.x>0)||B.x>W){ B.x=W/2; }
  B.x=clamp(B.x,margin(),W-margin());
}
addEventListener('resize',layout);
addEventListener('orientationchange',layout);

const B={x:(innerWidth||360)/2,y:0,vy:0,dir:-1,state:'idle',t:0,anger:0,goalX:null,spd:0,
         held:false,px:0,py:0,vx:0,tapT:0,frameClk:0,frameOn:false,squash:0,shake:0,ko:0,
         level:0,micCool:0};
let nextAct=0;

// ---------- mic ----------
const SEGS=20, meterEl=document.getElementById('meter'), segEls=[];
for(let i=0;i<SEGS;i++){const s=document.createElement('i');meterEl.appendChild(s);segEls.push(s);}
let analyser=null,freq=null,micOK=false;
async function startAudio(){try{
  const AC=window.AudioContext||window.webkitAudioContext; const ac=new AC(); await ac.resume();
  const st=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false}});
  const src=ac.createMediaStreamSource(st); analyser=ac.createAnalyser(); analyser.fftSize=512;
  analyser.smoothingTimeConstant=0.6; freq=new Uint8Array(analyser.frequencyBinCount);
  src.connect(analyser); micOK=true;
}catch(e){micOK=false;}}
function sampleLevel(){ if(!analyser)return 0; analyser.getByteFrequencyData(freq);
  let sum=0,n=0; const hi=Math.min(freq.length,90);
  for(let i=3;i<hi;i++){sum+=freq[i];n++;}
  return clamp(((sum/n)/255-0.04)*3.2,0,1); }
function drawMeter(){ const lit=Math.round(B.level*SEGS);
  for(let i=0;i<SEGS;i++){ const on=i<lit; const s=segEls[i];
    s.className = on ? (i>SEGS*0.8?'hi':'on') : ''; } }

const JUMP=560, G=1500;         // px/s, px/s^2
function grounded(){return B.y<=0.5 && !B.held;}

// ---------- interactions ----------
function poke(){ if(B.state==='defeated')return; B.anger=clamp(B.anger+1.3,0,10); B.shake=1;
  if(B.anger>4){enterAngry();} else setState('hurt',0.5); }
function hype(){ if(B.state==='defeated')return; B.anger=clamp(B.anger-0.5,0,10); B.hypeT=2.4; setState('run',0); B.goalX=rnd(margin(),W-margin()); }
function shakeHit(){ B.anger=clamp(B.anger+2.6,0,10); B.shake=1.6; enterAngry();
  if(B.anger>=9 && B.ko<=0){ setState('defeated',2.2); B.ko=2.2; } }
function enterAngry(){ if(B.state!=='defeated'){ setState('attack',0.55); B.angry=true; } }

function setState(s,dur){ B.state=s; B.t=dur||0; B.dur=dur||0; if(s==='attack')B.lunge=0; }

// ---------- brain (wander & fidget) ----------
function schedule(now){ nextAct=now+rnd(5500,13000); }   // ms: long pauses between actions
function think(now){
  if(B.held||!grounded())return;
  if(B.state==='hurt'||B.state==='attack'||B.state==='defeated')return;
  if(B.hypeT>0)return;
  if(now<nextAct)return;
  schedule(now);
  // mostly hangs in place; big moves are rare
  const r=Math.random();
  if(r<0.52){ setState('idle',rnd(4,8)); B.goalX=null; }
  else if(r<0.84){ B.goalX=rnd(margin(),W-margin()); setState('walk',0); }
  else if(r<0.90){ B.goalX=rnd(margin(),W-margin()); setState('run',0); }
  else if(r<0.94){ B.vy=JUMP; setState('jump',0); }
  else if(r<0.97){ setState('attack',1.4); }
  else { setState('climb',rnd(2.6,3.6)); }
}

// ---------- physics + state per frame ----------
function step(dt,now){
  // mic: smooth level, loud sound excites him
  const raw=micOK?sampleLevel():0;
  B.level=B.level+(raw-B.level)*(raw>B.level?0.5:0.12);
  drawMeter();
  if(micOK && B.level>0.45 && B.hypeT<=0 && B.state!=='defeated' && !B.held
     && B.state!=='hurt' && B.state!=='attack' && now>(B.micCool||0)){
    B.micCool=now+4000; B.hypeT=1.8; setState('run',0); B.goalX=rnd(margin(),W-margin());
  }
  B.anger=Math.max(0,B.anger-dt*0.6);
  B.shake=Math.max(0,B.shake-dt*3);
  if(B.ko>0)B.ko-=dt;
  if(B.hypeT>0){B.hypeT-=dt; if(B.hypeT<=0){setState('idle',1);} }
  R.style.setProperty('--glow',(0.10+B.anger*0.02+ (B.state==='run'?0.15:0)).toFixed(2));
  R.style.setProperty('--glowc', B.anger>3? '255,77,107':'69,229,247');
  rageEl.style.opacity=(clamp(B.anger/10,0,1)*0.55).toFixed(2);

  // gravity for airborne / dropped
  if(!B.held && (B.y>0 || B.vy!==0) && B.state!=='climb'){
    B.vy-=G*dt; B.y+=B.vy*dt;
    if(B.y<=0){ B.y=0; if(B.vy<-40){B.squash=1;} B.vy=0;
      if(B.state==='jump'||B.state==='fall'){ setState('idle',1); }
    }
    if(B.vy<0 && B.state==='jump') B.state='fall';
  }
  B.squash=Math.max(0,B.squash-dt*4);

  // horizontal goal seeking
  if((B.state==='walk'||B.state==='run')&&B.goalX!==null&&grounded()){
    const sp=(B.state==='run'?200:52)*(B.hypeT>0?1.3:1);
    const d=B.goalX-B.x; B.dir=d<0?-1:1;
    if(Math.abs(d)<6){ B.x=B.goalX; if(B.hypeT>0){B.goalX=rnd(margin(),W-margin());} else {setState('idle',rnd(4,7));B.goalX=null;} }
    else B.x+=Math.sign(d)*Math.min(Math.abs(d),sp*dt);
  }
  // climb: rise then descend over the state's duration (always >= floor)
  if(B.state==='climb'){ const p=B.dur>0?clamp(1-B.t/B.dur,0,1):0; B.y=Math.sin(p*Math.PI)*72; }

  // shadow-box lunges during attack (autonomous)
  if(B.state==='attack'){ B.lunge=(B.lunge||0)+dt; }

  // timed states expire
  if(B.t>0){ B.t-=dt; if(B.t<=0){
    if(B.state==='defeated'){ B.anger=2; setState('idle',1);}
    else if(B.state!=='walk'&&B.state!=='run'){ B.angry=false; setState('idle',rnd(3.5,6)); B.goalX=null; }
  }}

  think(now);
  render(now);
}

// A sprite sheet had a frame per state; a projection has a signal instead.
// Everything a state used to say with a pose it now says by how badly the
// colour split and the sweep are holding together.
function glitchFor(now){
  let g=1;
  if(B.state==='hurt')   g=4.5;
  if(B.state==='attack') g=2.6+Math.abs(Math.sin((B.lunge||0)*9))*2.2;
  if(B.state==='run')    g=1.9;
  if(B.state==='walk')   g=1.35;
  if(B.state==='climb')  g=2.2;
  if(B.state==='drag')   g=3.2;
  if(B.state==='defeated') g=6;
  return g + B.shake*4 + B.level*1.6;
}
function render(now){
  el.classList.toggle('hot', !!B.angry || B.anger>4);
  el.classList.toggle('ko', B.state==='defeated');
  el.style.setProperty('--gs', glitchFor(now).toFixed(2));

  let bob=0, rot=0, sy=1, ox=0;
  if(B.state==='idle') bob=Math.sin(now/1500)*3;
  if(B.state==='walk') bob=Math.abs(Math.sin(now/380))*4;
  if(B.state==='attack'){ ox=Math.sin((B.lunge||0)*10)*22; }
  if(B.shake>0){ ox+=Math.sin(now/24)*10*B.shake; rot+=Math.sin(now/30)*4*B.shake; }
  sy=1-B.squash*0.14; if(B.squash>0)bob=-0;
  el.style.left=B.x+'px';
  el.style.bottom=(floorPx()+B.y)+'px';
  el.style.transform=`translateX(-50%) translate(${ox}px,${-bob}px) rotate(${rot}deg) scale(1,${sy})`;
  // the pool of light brightens as he settles into it and fades as he rises
  const air=clamp(1-B.y/220,0.35,1);
  shadow.style.left=B.x+'px';
  shadow.style.transform=`translateX(-50%) scale(${air},${air})`;
  shadow.style.opacity=(0.75*air).toFixed(2);
}

// ---------- input ----------
function benderRect(){ const r=el.getBoundingClientRect(); return r; }
function hitBender(x,y){ const r=benderRect(); const pad=30;
  return x>r.left-pad&&x<r.right+pad&&y>r.top-pad&&y<r.bottom+pad; }

let downT=0,downX=0,downY=0,moved=false,lastTap=0,dragging=false,lastX=0,lastY=0,lastMoveT=0;
function onDown(x,y){ downT=performance.now();downX=x;downY=y;moved=false;
  if(hitBender(x,y)){ B.grab=true; lastX=x;lastY=y;lastMoveT=downT; } else B.grab=false; }
function onMove(x,y){ if(!B.grab)return;
  if(Math.hypot(x-downX,y-downY)>14){ moved=true; if(!dragging){dragging=true;B.held=true;setState('drag',0);} }
  if(dragging){ B.x=clamp(x,20,W-20); B.y=clamp((Hh-floorPx())-y,0,Hh);
    const t=performance.now(); const d=Math.max(1,t-lastMoveT); B.vxdrop=(x-lastX)/d*16; B.vydrop=-(y-lastY)/d*16; lastX=x;lastY=y;lastMoveT=t; } }
function onUp(x,y){
  if(dragging){ dragging=false;B.held=false; B.vy=clamp(B.vydrop||0,-300,300); setState('fall',0);
    if(Math.abs(B.vxdrop)>0){} B.grab=false; return; }
  if(B.grab && !moved){ const t=performance.now();
    if(t-lastTap<300){ lastTap=0; hype(); } else { lastTap=t; setTimeout(()=>{ if(performance.now()-t>=290 && lastTap===t){ poke(); } },300); } }
  B.grab=false;
}
stage.addEventListener('pointerdown',e=>onDown(e.clientX,e.clientY));
addEventListener('pointermove',e=>onMove(e.clientX,e.clientY));
addEventListener('pointerup',e=>onUp(e.clientX,e.clientY));

// device shake
let lastAcc={x:0,y:0,z:0},shakeCool=0;
function onMotion(e){ const a=e.accelerationIncludingGravity||e.acceleration; if(!a)return;
  const dx=Math.abs((a.x||0)-lastAcc.x),dy=Math.abs((a.y||0)-lastAcc.y),dz=Math.abs((a.z||0)-lastAcc.z);
  lastAcc={x:a.x||0,y:a.y||0,z:a.z||0};
  const now=performance.now();
  if(dx+dy+dz>32 && now>shakeCool){ shakeCool=now+700; shakeHit(); } }

// wake / permissions / loop
let wakeLock=null; async function keepAwake(){try{if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen');}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepAwake();});
let booted=false;
async function boot(){ if(booted)return;booted=true;
  keepAwake();
  await startAudio();
  try{ if(typeof DeviceMotionEvent!=='undefined'&&DeviceMotionEvent.requestPermission){
        const p=await DeviceMotionEvent.requestPermission(); if(p==='granted')addEventListener('devicemotion',onMotion);
      } else addEventListener('devicemotion',onMotion);
  }catch(e){}
  layout(); B.x=W/2;                 // recenter now that the viewport is definitely laid out
  wake.classList.add('hidden');
}
wake.addEventListener('click',boot);
wake.addEventListener('touchend',e=>{e.preventDefault();boot();},{passive:false});

let last=performance.now();
function loop(now){ const dt=Math.min(0.05,(now-last)/1000); last=now; step(dt,now); requestAnimationFrame(loop); }
layout(); schedule(performance.now()); requestAnimationFrame(loop);
addEventListener('load',layout);
</script>
